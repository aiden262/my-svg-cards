<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>为人民服务 — 汉语新解</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #08090d;
            --surface-glass: rgba(18, 20, 29, 0.72);
            --surface-elevated: rgba(28, 32, 48, 0.85);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.18);
            --border-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --accent-glow: 0 0 24px rgba(99, 102, 241, 0.3);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-card: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-subtle);
            --shadow-float: 0 12px 30px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-subtle);
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: var(--font-sans);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- 氛围背景 ---------- */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: pulse-glow 12s ease-in-out infinite alternate;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35), transparent 70%);
            top: -100px;
            left: 20%;
        }

        .glow-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.2), transparent 70%);
            bottom: -150px;
            right: 15%;
            animation-delay: -6s;
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.15) translate(30px, 20px); opacity: 0.55; }
        }

        /* ---------- 主容器布局 ---------- */
        .viewport-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            padding: 16px;
        }

        /* ---------- 核心展示卡片 ---------- */
        .card-stage {
            position: relative;
            width: 100%;
            max-width: 860px;
            height: calc(100vh - 32px);
            height: calc(100dvh - 32px);
            background: var(--surface-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card-stage:hover {
            border-color: var(--border-highlight);
            box-shadow: var(--shadow-card), 0 0 30px rgba(99, 102, 241, 0.12);
        }

        /* ---------- 顶部状态条 ---------- */
        .stage-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(10, 12, 18, 0.4);
            flex-shrink: 0;
            gap: 12px;
        }

        .header-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .badge-style {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge-style .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #818cf8;
            box-shadow: 0 0 8px #818cf8;
        }

        .badge-model {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            font-size: 0.72rem;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
        }

        .btn-icon-action:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        .btn-icon-action svg {
            width: 15px;
            height: 15px;
        }

        /* ---------- SVG 渲染画布区 ---------- */
        .canvas-area {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            cursor: zoom-in;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 80%);
        }

        .canvas-area svg {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.35s var(--ease-spring), filter 0.3s ease;
            transform-origin: center center;
        }

        .canvas-area:hover svg {
            transform: scale(1.012);
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.6));
        }

        /* 悬浮缩放指示气泡 */
        .zoom-hint {
            position: absolute;
            top: 14px;
            right: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 99px;
            background: rgba(15, 18, 26, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-6px);
            transition: all 0.25s var(--ease-spring);
            z-index: 5;
        }

        .canvas-area:hover .zoom-hint,
        .canvas-area.has-overflow .zoom-hint {
            opacity: 1;
            transform: translateY(0);
        }

        .zoom-hint svg {
            width: 13px;
            height: 13px;
        }

        /* 溢出渐变遮罩 */
        .overflow-fade {
            position: absolute;
            inset: auto 0 0 0;
            height: 48px;
            background: linear-gradient(to bottom, transparent, var(--surface-glass));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 4;
        }

        .overflow-fade.visible {
            opacity: 1;
        }

        /* ---------- 底部元数据与操作工具栏 ---------- */
        .stage-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(10, 12, 18, 0.5);
            flex-shrink: 0;
            gap: 16px;
        }

        .footer-prompt {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .prompt-quote-icon {
            color: var(--accent-primary);
            flex-shrink: 0;
            opacity: 0.8;
        }

        .prompt-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .footer-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-toolbar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: 1px solid transparent;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-toolbar svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* ---------- 全屏灯箱 Lightbox ---------- */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 6, 9, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--ease-spring);
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-body {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            overflow: auto;
        }

        .lightbox-body svg {
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--border-subtle);
            cursor: zoom-out;
        }

        .lightbox-close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1010;
        }

        .lightbox-close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: scale(1.05);
        }

        .lightbox-close-btn svg {
            width: 18px;
            height: 18px;
        }

        .lightbox-floating-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 99px;
            background: rgba(20, 24, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-highlight);
            box-shadow: var(--shadow-float);
            z-index: 1010;
        }

        /* ---------- 统一 Toast 提示 ---------- */
        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -20px);
            padding: 8px 16px;
            border-radius: 99px;
            background: rgba(20, 24, 35, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-highlight);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-float);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s var(--ease-spring);
            z-index: 2000;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast-notification .toast-icon {
            color: #10b981;
            width: 15px;
            height: 15px;
        }

        /* ---------- 移动端响应式微调 ---------- */
        @media (max-width: 640px) {
            .viewport-wrapper {
                padding: 8px;
            }
            .card-stage {
                height: calc(100vh - 16px);
                height: calc(100dvh - 16px);
                border-radius: var(--radius-lg);
            }
            .stage-header {
                padding: 10px 14px;
            }
            .canvas-area {
                padding: 12px;
            }
            .stage-footer {
                padding: 10px 14px;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .footer-buttons {
                justify-content: flex-end;
            }
            .btn-toolbar {
                padding: 6px 12px;
                font-size: 0.72rem;
            }
            .lightbox-body {
                padding: 40px 12px;
            }
            .lightbox-floating-bar {
                bottom: 16px;
                width: calc(100% - 32px);
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 氛围背景 -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- 主卡片舞台 -->
    <main class="viewport-wrapper">
        <article class="card-stage">
            <!-- 顶部状态栏 -->
            <header class="stage-header">
                <div class="header-badges">
                    <span class="badge badge-style">
                        <span class="dot"></span>
                        汉语新解
                    </span>
                    <span class="badge badge-model">DeepSeek V4 Flash</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon-action" id="btnCopySvg" title="复制 SVG 源码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                    <button class="btn-icon-action" id="btnZoomTrigger" title="放大查看">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                </div>
            </header>

            <!-- SVG 核心画布容器 -->
            <div class="canvas-area" id="canvasArea" title="点击放大查看">
                <div class="overflow-fade" id="overflowFade"></div>
                <div class="zoom-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    全屏查看
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <rect width="400" height="600" fill="#1A2634"/>
  
  <!-- 装饰元素 -->
  <circle cx="200" cy="300" r="150" fill="none" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
  <path d="M -20 200 Q 100 150 200 200 T 420 200" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.5" stroke-dasharray="4 4"/>
  <path d="M -20 450 Q 100 500 200 450 T 420 450" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.5" stroke-dasharray="4 4"/>
  
  <!-- 标题 -->
  <text x="200" y="50" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="22" font-weight="bold" fill="#F5F5F0" letter-spacing="8">汉语新解</text>
  
  <!-- 分隔线 -->
  <line x1="100" y1="70" x2="300" y2="70" stroke="#F5F5F0" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
  
  <!-- 被解释的词汇 -->
  <text x="200" y="120" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="28" font-weight="bold" fill="#F5F5F0" letter-spacing="2">为人民服务</text>
  
  <!-- 英文对照 -->
  <text x="200" y="145" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="12" fill="#F5F5F0" opacity="0.6" font-style="italic">Serve the People</text>
  
  <!-- 核心解释 -->
  <text x="200" y="190" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="18" fill="#F5F5F0">
    <tspan x="200" dy="0">他们把“人民”调成蜜糖，</tspan>
    <tspan x="200" dy="30">涂在锁链上，</tspan>
    <tspan x="200" dy="30">称之为“服务”。</tspan>
  </text>
  
  <!-- 批判内核线条图（锁链与蜜糖） -->
  <g stroke="#F5F5F0" stroke-width="2" fill="none" opacity="0.85" transform="translate(0, 30)">
    <!-- 蜜糖滴 -->
    <circle cx="200" cy="280" r="6" fill="#F5F5F0" stroke="none" opacity="0.7"/>
    <!-- 锁链链条 -->
    <ellipse cx="155" cy="320" rx="18" ry="10"/>
    <ellipse cx="245" cy="320" rx="18" ry="10"/>
    <line x1="173" y1="320" x2="227" y2="320"/>
    <ellipse cx="200" cy="350" rx="18" ry="10"/>
    <line x1="160" y1="328" x2="200" y2="342"/>
    <line x1="240" y1="328" x2="200" y2="342"/>
    <!-- 波浪线表示锁链延伸 -->
    <path d="M 200 360 Q 180 380 160 370 T 120 380" stroke-width="1.5"/>
    <path d="M 200 360 Q 220 380 240 370 T 280 380" stroke-width="1.5"/>
  </g>
  
  <!-- 极简总结 -->
  <text x="200" y="530" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="16" fill="#F5F5F0" opacity="0.8">糖衣与铁链，皆成自画像。</text>
</svg>
            </div>

            <!-- 底部操作与信息栏 -->
            <footer class="stage-footer">
                <div class="footer-prompt">
                    <svg class="prompt-quote-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>
                    <span class="prompt-text" title="为人民服务">为人民服务</span>
                </div>
                <div class="footer-buttons">
                    <button class="btn-toolbar btn-secondary" id="btnDownloadSvg">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        SVG
                    </button>
                    <button class="btn-toolbar btn-primary" id="btnDownloadPng">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        导出高清 PNG
                    </button>
                </div>
            </footer>
        </article>
    </main>

    <!-- 全屏灯箱 Modal -->
    <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true">
        <button class="lightbox-close-btn" id="lightboxCloseBtn" title="关闭 (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="lightbox-body" id="lightboxBody">
            <svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <rect width="400" height="600" fill="#1A2634"/>
  
  <!-- 装饰元素 -->
  <circle cx="200" cy="300" r="150" fill="none" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
  <path d="M -20 200 Q 100 150 200 200 T 420 200" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.5" stroke-dasharray="4 4"/>
  <path d="M -20 450 Q 100 500 200 450 T 420 450" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.5" stroke-dasharray="4 4"/>
  
  <!-- 标题 -->
  <text x="200" y="50" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="22" font-weight="bold" fill="#F5F5F0" letter-spacing="8">汉语新解</text>
  
  <!-- 分隔线 -->
  <line x1="100" y1="70" x2="300" y2="70" stroke="#F5F5F0" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
  
  <!-- 被解释的词汇 -->
  <text x="200" y="120" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="28" font-weight="bold" fill="#F5F5F0" letter-spacing="2">为人民服务</text>
  
  <!-- 英文对照 -->
  <text x="200" y="145" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="12" fill="#F5F5F0" opacity="0.6" font-style="italic">Serve the People</text>
  
  <!-- 核心解释 -->
  <text x="200" y="190" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="18" fill="#F5F5F0">
    <tspan x="200" dy="0">他们把“人民”调成蜜糖，</tspan>
    <tspan x="200" dy="30">涂在锁链上，</tspan>
    <tspan x="200" dy="30">称之为“服务”。</tspan>
  </text>
  
  <!-- 批判内核线条图（锁链与蜜糖） -->
  <g stroke="#F5F5F0" stroke-width="2" fill="none" opacity="0.85" transform="translate(0, 30)">
    <!-- 蜜糖滴 -->
    <circle cx="200" cy="280" r="6" fill="#F5F5F0" stroke="none" opacity="0.7"/>
    <!-- 锁链链条 -->
    <ellipse cx="155" cy="320" rx="18" ry="10"/>
    <ellipse cx="245" cy="320" rx="18" ry="10"/>
    <line x1="173" y1="320" x2="227" y2="320"/>
    <ellipse cx="200" cy="350" rx="18" ry="10"/>
    <line x1="160" y1="328" x2="200" y2="342"/>
    <line x1="240" y1="328" x2="200" y2="342"/>
    <!-- 波浪线表示锁链延伸 -->
    <path d="M 200 360 Q 180 380 160 370 T 120 380" stroke-width="1.5"/>
    <path d="M 200 360 Q 220 380 240 370 T 280 380" stroke-width="1.5"/>
  </g>
  
  <!-- 极简总结 -->
  <text x="200" y="530" text-anchor="middle" font-family="'Noto Serif CJK SC', 'Source Han Serif SC', 'Serif'" font-size="16" fill="#F5F5F0" opacity="0.8">糖衣与铁链，皆成自画像。</text>
</svg>
        </div>
        <div class="lightbox-floating-bar">
            <button class="btn-toolbar btn-secondary" id="lightboxDownloadSvg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载 SVG
            </button>
            <button class="btn-toolbar btn-primary" id="lightboxDownloadPng">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                下载高清 PNG (2x)
            </button>
        </div>
    </div>

    <!-- 统一 Toast 消息提示 -->
    <div class="toast-notification" id="toastNotification">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        (function() {
            var canvasArea = document.getElementById('canvasArea');
            var overflowFade = document.getElementById('overflowFade');
            var lightboxModal = document.getElementById('lightboxModal');
            var lightboxBody = document.getElementById('lightboxBody');
            var lightboxCloseBtn = document.getElementById('lightboxCloseBtn');
            var btnZoomTrigger = document.getElementById('btnZoomTrigger');
            var btnCopySvg = document.getElementById('btnCopySvg');
            var btnDownloadPng = document.getElementById('btnDownloadPng');
            var btnDownloadSvg = document.getElementById('btnDownloadSvg');
            var lightboxDownloadPng = document.getElementById('lightboxDownloadPng');
            var lightboxDownloadSvg = document.getElementById('lightboxDownloadSvg');
            var toastNotification = document.getElementById('toastNotification');
            var toastMessage = document.getElementById('toastMessage');
            var toastTimer = null;

            var svgElement = canvasArea.querySelector(':scope > svg');

            // --- 提示框 Toast ---
            function showToast(msg) {
                toastMessage.textContent = msg;
                toastNotification.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function() {
                    toastNotification.classList.remove('show');
                }, 2200);
            }

            // --- 溢出检测 ---
            function checkOverflow() {
                if (!svgElement) return;
                var areaRect = canvasArea.getBoundingClientRect();
                var svgRect = svgElement.getBoundingClientRect();
                if (svgRect.bottom > areaRect.bottom + 4) {
                    overflowFade.classList.add('visible');
                    canvasArea.classList.add('has-overflow');
                } else {
                    overflowFade.classList.remove('visible');
                    canvasArea.classList.remove('has-overflow');
                }
            }

            window.addEventListener('resize', checkOverflow);
            setTimeout(checkOverflow, 150);

            // --- 获取 SVG 源码字符串 ---
            function getSvgXml() {
                if (!svgElement) return '';
                var clone = svgElement.cloneNode(true);
                return new XMLSerializer().serializeToString(clone);
            }

            // --- 复制 SVG 代码 ---
            btnCopySvg.addEventListener('click', function(e) {
                e.stopPropagation();
                var xml = getSvgXml();
                if (!xml) return;
                navigator.clipboard.writeText(xml).then(function() {
                    showToast('✓ SVG 代码已复制到剪贴板');
                }).catch(function() {
                    showToast('复制失败，请重试');
                });
            });

            // --- 打开 / 关闭 灯箱 ---
            function openLightbox() {
                var srcSvg = canvasArea.querySelector(':scope > svg');
                var dstSvg = lightboxBody.querySelector(':scope > svg');
                if (srcSvg && dstSvg) {
                    dstSvg.parentNode.replaceChild(srcSvg.cloneNode(true), dstSvg);
                }
                lightboxModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightboxModal.classList.remove('active');
                document.body.style.overflow = '';
            }

            canvasArea.addEventListener('click', function(e) {
                if (e.target.closest('.zoom-hint')) return;
                openLightbox();
            });

            btnZoomTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                openLightbox();
            });

            lightboxCloseBtn.addEventListener('click', closeLightbox);
            lightboxModal.addEventListener('click', function(e) {
                if (e.target === lightboxModal || e.target === lightboxBody) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
                    closeLightbox();
                }
            });

            // --- 获取 SVG 物理尺寸 ---
            function getSvgSize() {
                if (!svgElement) return { width: 800, height: 600 };
                var viewBox = svgElement.getAttribute('viewBox');
                if (viewBox) {
                    var parts = viewBox.trim().split(/[\s,]+/);
                    if (parts.length >= 4) {
                        return { width: parseFloat(parts[2]), height: parseFloat(parts[3]) };
                    }
                }
                var w = parseFloat(svgElement.getAttribute('width'));
                var h = parseFloat(svgElement.getAttribute('height'));
                if (w && h) return { width: w, height: h };
                var rect = svgElement.getBoundingClientRect();
                return { width: rect.width || 800, height: rect.height || 600 };
            }

            // --- 导出高清 PNG ---
            function exportPng(scale) {
                scale = scale || 2;
                var xml = getSvgXml();
                if (!xml) return;

                showToast('正在渲染高清图片...');
                var blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var img = new Image();

                img.onload = function() {
                    var size = getSvgSize();
                    var canvas = document.createElement('canvas');
                    canvas.width = Math.round(size.width * scale);
                    canvas.height = Math.round(size.height * scale);
                    var ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(function(pngBlob) {
                        var pngUrl = URL.createObjectURL(pngBlob);
                        var a = document.createElement('a');
                        a.href = pngUrl;
                        a.download = 'card-' + Date.now() + '.png';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(function() {
                            URL.revokeObjectURL(pngUrl);
                            URL.revokeObjectURL(url);
                        }, 1200);
                        showToast('✓ 高清 PNG 已下载');
                    }, 'image/png');
                };

                img.onerror = function() {
                    URL.revokeObjectURL(url);
                    showToast('渲染 PNG 失败，请直接下载 SVG');
                };

                img.src = url;
            }

            // --- 导出 SVG 原文件 ---
            function exportSvg() {
                var xml = getSvgXml();
                if (!xml) return;
                var blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'card-' + Date.now() + '.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 1200);
                showToast('✓ SVG 文件已下载');
            }

            // --- 绑定下载事件 ---
            btnDownloadPng.addEventListener('click', function(e) {
                e.stopPropagation();
                exportPng(2);
            });
            btnDownloadSvg.addEventListener('click', function(e) {
                e.stopPropagation();
                exportSvg();
            });

            lightboxDownloadPng.addEventListener('click', function(e) {
                e.stopPropagation();
                exportPng(2);
            });
            lightboxDownloadSvg.addEventListener('click', function(e) {
                e.stopPropagation();
                exportSvg();
            });
        })();
    </script>
</body>
</html>
