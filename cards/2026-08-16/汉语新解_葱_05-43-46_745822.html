<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>葱 — 汉语新解</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #08090d;
            --surface-glass: rgba(18, 20, 29, 0.72);
            --surface-elevated: rgba(28, 32, 48, 0.85);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.18);
            --border-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            --accent-glow: 0 0 24px rgba(99, 102, 241, 0.3);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-card: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-subtle);
            --shadow-float: 0 12px 30px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-subtle);
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: var(--font-sans);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- 氛围背景 ---------- */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: pulse-glow 12s ease-in-out infinite alternate;
        }

        .glow-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35), transparent 70%);
            top: -100px;
            left: 20%;
        }

        .glow-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.2), transparent 70%);
            bottom: -150px;
            right: 15%;
            animation-delay: -6s;
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 100%);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.15) translate(30px, 20px); opacity: 0.55; }
        }

        /* ---------- 主容器布局 ---------- */
        .viewport-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            padding: 16px;
        }

        /* ---------- 核心展示卡片 ---------- */
        .card-stage {
            position: relative;
            width: 100%;
            max-width: 860px;
            height: calc(100vh - 32px);
            height: calc(100dvh - 32px);
            background: var(--surface-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card-stage:hover {
            border-color: var(--border-highlight);
            box-shadow: var(--shadow-card), 0 0 30px rgba(99, 102, 241, 0.12);
        }

        /* ---------- 顶部状态条 ---------- */
        .stage-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(10, 12, 18, 0.4);
            flex-shrink: 0;
            gap: 12px;
        }

        .header-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .badge-style {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge-style .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #818cf8;
            box-shadow: 0 0 8px #818cf8;
        }

        .badge-model {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            font-size: 0.72rem;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
        }

        .btn-icon-action:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        .btn-icon-action svg {
            width: 15px;
            height: 15px;
        }

        /* ---------- SVG 渲染画布区 ---------- */
        .canvas-area {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            cursor: zoom-in;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 80%);
        }

        .canvas-area svg {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.35s var(--ease-spring), filter 0.3s ease;
            transform-origin: center center;
        }

        .canvas-area:hover svg {
            transform: scale(1.012);
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.6));
        }

        /* 悬浮缩放指示气泡 */
        .zoom-hint {
            position: absolute;
            top: 14px;
            right: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 99px;
            background: rgba(15, 18, 26, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-6px);
            transition: all 0.25s var(--ease-spring);
            z-index: 5;
        }

        .canvas-area:hover .zoom-hint,
        .canvas-area.has-overflow .zoom-hint {
            opacity: 1;
            transform: translateY(0);
        }

        .zoom-hint svg {
            width: 13px;
            height: 13px;
        }

        /* 溢出渐变遮罩 */
        .overflow-fade {
            position: absolute;
            inset: auto 0 0 0;
            height: 48px;
            background: linear-gradient(to bottom, transparent, var(--surface-glass));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 4;
        }

        .overflow-fade.visible {
            opacity: 1;
        }

        /* ---------- 底部元数据与操作工具栏 ---------- */
        .stage-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(10, 12, 18, 0.5);
            flex-shrink: 0;
            gap: 16px;
        }

        .footer-prompt {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .prompt-quote-icon {
            color: var(--accent-primary);
            flex-shrink: 0;
            opacity: 0.8;
        }

        .prompt-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .footer-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-toolbar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            border: 1px solid transparent;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-toolbar svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* ---------- 全屏灯箱 Lightbox ---------- */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 6, 9, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--ease-spring);
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-body {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            overflow: auto;
        }

        .lightbox-body svg {
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--border-subtle);
            cursor: zoom-out;
        }

        .lightbox-close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1010;
        }

        .lightbox-close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: scale(1.05);
        }

        .lightbox-close-btn svg {
            width: 18px;
            height: 18px;
        }

        .lightbox-floating-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 99px;
            background: rgba(20, 24, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-highlight);
            box-shadow: var(--shadow-float);
            z-index: 1010;
        }

        /* ---------- 统一 Toast 提示 ---------- */
        .toast-notification {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -20px);
            padding: 8px 16px;
            border-radius: 99px;
            background: rgba(20, 24, 35, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-highlight);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-float);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s var(--ease-spring);
            z-index: 2000;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast-notification .toast-icon {
            color: #10b981;
            width: 15px;
            height: 15px;
        }

        /* ---------- 移动端响应式微调 ---------- */
        @media (max-width: 640px) {
            .viewport-wrapper {
                padding: 8px;
            }
            .card-stage {
                height: calc(100vh - 16px);
                height: calc(100dvh - 16px);
                border-radius: var(--radius-lg);
            }
            .stage-header {
                padding: 10px 14px;
            }
            .canvas-area {
                padding: 12px;
            }
            .stage-footer {
                padding: 10px 14px;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .footer-buttons {
                justify-content: flex-end;
            }
            .btn-toolbar {
                padding: 6px 12px;
                font-size: 0.72rem;
            }
            .lightbox-body {
                padding: 40px 12px;
            }
            .lightbox-floating-bar {
                bottom: 16px;
                width: calc(100% - 32px);
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- 氛围背景 -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- 主卡片舞台 -->
    <main class="viewport-wrapper">
        <article class="card-stage">
            <!-- 顶部状态栏 -->
            <header class="stage-header">
                <div class="header-badges">
                    <span class="badge badge-style">
                        <span class="dot"></span>
                        汉语新解
                    </span>
                    <span class="badge badge-model">Gemini 3.7 Flash</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon-action" id="btnCopySvg" title="复制 SVG 源码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                    <button class="btn-icon-action" id="btnZoomTrigger" title="放大查看">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    </button>
                </div>
            </header>

            <!-- SVG 核心画布容器 -->
            <div class="canvas-area" id="canvasArea" title="点击放大查看">
                <div class="overflow-fade" id="overflowFade"></div>
                <div class="zoom-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                    全屏查看
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <style>
      .serif {
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Source Han Serif", "STSong", "Songti SC", "SimSun", serif;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .title { fill: #A8A090; font-size: 13px; letter-spacing: 4px; font-weight: 500; }
      .word { fill: #2C3E50; font-size: 42px; font-weight: 900; letter-spacing: 2px; }
      .sub-word { fill: #8C8275; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
      .desc { fill: #2C3E50; font-size: 17px; line-height: 1.8; font-weight: 600; letter-spacing: 0.5px; }
      .quote-mark { fill: #D5CBB8; font-size: 48px; font-family: Georgia, serif; }
      .tag { fill: #A8A090; font-size: 11px; letter-spacing: 3px; }
      .stamp-rect { fill: none; stroke: #8B3A3A; stroke-width: 1.5; }
      .stamp-text { fill: #8B3A3A; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6DCBF" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- 背景：温润古籍泛黄色调 -->
  <rect width="400" height="600" fill="#F0E6D2" />
  <rect width="400" height="600" fill="url(#grid)" opacity="0.4" />
  
  <!-- 内边框装饰 -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#DCD1BC" stroke-width="1" />
  <rect x="24" y="24" width="352" height="552" fill="none" stroke="#DCD1BC" stroke-width="0.5" />

  <!-- 顶部：居中标题与虚线 -->
  <g transform="translate(200, 52)">
    <text class="sans title" text-anchor="middle">汉 语 新 解</text>
    <line x1="-155" y1="18" x2="155" y2="18" stroke="#D5CBB8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- 核心词汇区 -->
  <g transform="translate(45, 115)">
    <text class="serif word" x="0" y="0">葱</text>
    <text class="sans sub-word" x="2" y="22">SCALLION / NEGI</text>
    <text class="serif" x="2" y="38" fill="#A8A090" font-size="11px">「 名词，亦是一种处境 」</text>
  </g>

  <!-- 讽刺隐喻配图 (极简抽象线条) -->
  <g transform="translate(260, 95)">
    <!-- 抽象锅与沸油/热气，几片被切碎落下的葱花 -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#E0D5BE" stroke-width="1" />
    <path d="M25 65 Q 50 80, 75 65" fill="none" stroke="#A8A090" stroke-width="2" stroke-linecap="round"/>
    <!-- 爆香的葱段（倾斜、零散、被榨取） -->
    <rect x="35" y="30" width="6" height="18" rx="2" transform="rotate(-25 35 30)" fill="#7A8B7B" opacity="0.8"/>
    <rect x="52" y="22" width="6" height="22" rx="2" transform="rotate(15 52 22)" fill="#8A9A86" opacity="0.9"/>
    <rect x="68" y="38" width="5" height="14" rx="2" transform="rotate(45 68 38)" fill="#A2B097" opacity="0.7"/>
    <!-- 蒸发的香气线 -->
    <path d="M42 20 Q 40 10, 48 5" fill="none" stroke="#C5BAA5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
    <path d="M58 16 Q 62 8, 56 2" fill="none" stroke="#C5BAA5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
  </g>

  <!-- 中间解释卡片区域 -->
  <g transform="translate(45, 230)">
    <text class="quote-mark" x="-10" y="0">“</text>
    <text class="serif desc" x="0" y="25">
      <tspan x="0" dy="0">自以为是提味的点睛之笔，</tspan>
      <tspan x="0" dy="32">其实热油泼下时，</tspan>
      <tspan x="0" dy="32">别人要的只是你被榨干的那点香；</tspan>
      <tspan x="0" dy="32">主菜一上席，</tspan>
      <tspan x="0" dy="32">你便是盘底最先被挑出来的残渣。</tspan>
    </text>
  </g>

  <!-- 底部装裱区 -->
  <g transform="translate(45, 520)">
    <line x1="0" y1="0" x2="310" y2="0" stroke="#D5CBB8" stroke-width="1" stroke-dasharray="3 3" />
    
    <text class="sans tag" x="0" y="28">THE GARNISH PHILOSOPHY</text>
    
    <!-- 红色批判印章 -->
    <g transform="translate(245, 8)">
      <rect class="stamp-rect" x="0" y="0" width="65" height="24" rx="3" />
      <text class="serif stamp-text" x="7" y="16">提味即弃</text>
    </g>
  </g>

    <!-- 全屏灯箱 Modal -->
    <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true">
        <button class="lightbox-close-btn" id="lightboxCloseBtn" title="关闭 (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="lightbox-body" id="lightboxBody">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <style>
      .serif {
        font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Source Han Serif", "STSong", "Songti SC", "SimSun", serif;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .title { fill: #A8A090; font-size: 13px; letter-spacing: 4px; font-weight: 500; }
      .word { fill: #2C3E50; font-size: 42px; font-weight: 900; letter-spacing: 2px; }
      .sub-word { fill: #8C8275; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
      .desc { fill: #2C3E50; font-size: 17px; line-height: 1.8; font-weight: 600; letter-spacing: 0.5px; }
      .quote-mark { fill: #D5CBB8; font-size: 48px; font-family: Georgia, serif; }
      .tag { fill: #A8A090; font-size: 11px; letter-spacing: 3px; }
      .stamp-rect { fill: none; stroke: #8B3A3A; stroke-width: 1.5; }
      .stamp-text { fill: #8B3A3A; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E6DCBF" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- 背景：温润古籍泛黄色调 -->
  <rect width="400" height="600" fill="#F0E6D2" />
  <rect width="400" height="600" fill="url(#grid)" opacity="0.4" />
  
  <!-- 内边框装饰 -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#DCD1BC" stroke-width="1" />
  <rect x="24" y="24" width="352" height="552" fill="none" stroke="#DCD1BC" stroke-width="0.5" />

  <!-- 顶部：居中标题与虚线 -->
  <g transform="translate(200, 52)">
    <text class="sans title" text-anchor="middle">汉 语 新 解</text>
    <line x1="-155" y1="18" x2="155" y2="18" stroke="#D5CBB8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- 核心词汇区 -->
  <g transform="translate(45, 115)">
    <text class="serif word" x="0" y="0">葱</text>
    <text class="sans sub-word" x="2" y="22">SCALLION / NEGI</text>
    <text class="serif" x="2" y="38" fill="#A8A090" font-size="11px">「 名词，亦是一种处境 」</text>
  </g>

  <!-- 讽刺隐喻配图 (极简抽象线条) -->
  <g transform="translate(260, 95)">
    <!-- 抽象锅与沸油/热气，几片被切碎落下的葱花 -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#E0D5BE" stroke-width="1" />
    <path d="M25 65 Q 50 80, 75 65" fill="none" stroke="#A8A090" stroke-width="2" stroke-linecap="round"/>
    <!-- 爆香的葱段（倾斜、零散、被榨取） -->
    <rect x="35" y="30" width="6" height="18" rx="2" transform="rotate(-25 35 30)" fill="#7A8B7B" opacity="0.8"/>
    <rect x="52" y="22" width="6" height="22" rx="2" transform="rotate(15 52 22)" fill="#8A9A86" opacity="0.9"/>
    <rect x="68" y="38" width="5" height="14" rx="2" transform="rotate(45 68 38)" fill="#A2B097" opacity="0.7"/>
    <!-- 蒸发的香气线 -->
    <path d="M42 20 Q 40 10, 48 5" fill="none" stroke="#C5BAA5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
    <path d="M58 16 Q 62 8, 56 2" fill="none" stroke="#C5BAA5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
  </g>

  <!-- 中间解释卡片区域 -->
  <g transform="translate(45, 230)">
    <text class="quote-mark" x="-10" y="0">“</text>
    <text class="serif desc" x="0" y="25">
      <tspan x="0" dy="0">自以为是提味的点睛之笔，</tspan>
      <tspan x="0" dy="32">其实热油泼下时，</tspan>
      <tspan x="0" dy="32">别人要的只是你被榨干的那点香；</tspan>
      <tspan x="0" dy="32">主菜一上席，</tspan>
      <tspan x="0" dy="32">你便是盘底最先被挑出来的残渣。</tspan>
    </text>
  </g>

  <!-- 底部装裱区 -->
  <g transform="translate(45, 520)">
    <line x1="0" y1="0" x2="310" y2="0" stroke="#D5CBB8" stroke-width="1" stroke-dasharray="3 3" />
    
    <text class="sans tag" x="0" y="28">THE GARNISH PHILOSOPHY</text>
    
    <!-- 红色批判印章 -->
    <g transform="translate(245, 8)">
      <rect class="stamp-rect" x="0" y="0" width="65" height="24" rx="3" />
      <text class="serif stamp-text" x="7" y="16">提味即弃</text>
    </g>
  </g>
</svg>
        </div>
        <div class="lightbox-floating-bar">
            <button class="btn-toolbar btn-secondary" id="lightboxDownloadSvg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载 SVG
            </button>
            <button class="btn-toolbar btn-primary" id="lightboxDownloadPng">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                下载高清 PNG (2x)
            </button>
        </div>
    </div>

    <!-- 统一 Toast 消息提示 -->
    <div class="toast-notification" id="toastNotification">
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        (function() {
            var canvasArea = document.getElementById('canvasArea');
            var overflowFade = document.getElementById('overflowFade');
            var lightboxModal = document.getElementById('lightboxModal');
            var lightboxBody = document.getElementById('lightboxBody');
            var lightboxCloseBtn = document.getElementById('lightboxCloseBtn');
            var btnZoomTrigger = document.getElementById('btnZoomTrigger');
            var btnCopySvg = document.getElementById('btnCopySvg');
            var btnDownloadPng = document.getElementById('btnDownloadPng');
            var btnDownloadSvg = document.getElementById('btnDownloadSvg');
            var lightboxDownloadPng = document.getElementById('lightboxDownloadPng');
            var lightboxDownloadSvg = document.getElementById('lightboxDownloadSvg');
            var toastNotification = document.getElementById('toastNotification');
            var toastMessage = document.getElementById('toastMessage');
            var toastTimer = null;

            var svgElement = canvasArea.querySelector(':scope > svg');

            // --- 提示框 Toast ---
            function showToast(msg) {
                toastMessage.textContent = msg;
                toastNotification.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function() {
                    toastNotification.classList.remove('show');
                }, 2200);
            }

            // --- 溢出检测 ---
            function checkOverflow() {
                if (!svgElement) return;
                var areaRect = canvasArea.getBoundingClientRect();
                var svgRect = svgElement.getBoundingClientRect();
                if (svgRect.bottom > areaRect.bottom + 4) {
                    overflowFade.classList.add('visible');
                    canvasArea.classList.add('has-overflow');
                } else {
                    overflowFade.classList.remove('visible');
                    canvasArea.classList.remove('has-overflow');
                }
            }

            window.addEventListener('resize', checkOverflow);
            setTimeout(checkOverflow, 150);

            // --- 获取 SVG 源码字符串 ---
            function getSvgXml() {
                if (!svgElement) return '';
                var clone = svgElement.cloneNode(true);
                return new XMLSerializer().serializeToString(clone);
            }

            // --- 复制 SVG 代码 ---
            btnCopySvg.addEventListener('click', function(e) {
                e.stopPropagation();
                var xml = getSvgXml();
                if (!xml) return;
                navigator.clipboard.writeText(xml).then(function() {
                    showToast('✓ SVG 代码已复制到剪贴板');
                }).catch(function() {
                    showToast('复制失败，请重试');
                });
            });

            // --- 打开 / 关闭 灯箱 ---
            function openLightbox() {
                var srcSvg = canvasArea.querySelector(':scope > svg');
                var dstSvg = lightboxBody.querySelector(':scope > svg');
                if (srcSvg && dstSvg) {
                    dstSvg.parentNode.replaceChild(srcSvg.cloneNode(true), dstSvg);
                }
                lightboxModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightboxModal.classList.remove('active');
                document.body.style.overflow = '';
            }

            canvasArea.addEventListener('click', function(e) {
                if (e.target.closest('.zoom-hint')) return;
                openLightbox();
            });

            btnZoomTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                openLightbox();
            });

            lightboxCloseBtn.addEventListener('click', closeLightbox);
            lightboxModal.addEventListener('click', function(e) {
                if (e.target === lightboxModal || e.target === lightboxBody) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightboxModal.classList.contains('active')) {
                    closeLightbox();
                }
            });

            // --- 获取 SVG 物理尺寸 ---
            function getSvgSize() {
                if (!svgElement) return { width: 800, height: 600 };
                var viewBox = svgElement.getAttribute('viewBox');
                if (viewBox) {
                    var parts = viewBox.trim().split(/[\s,]+/);
                    if (parts.length >= 4) {
                        return { width: parseFloat(parts[2]), height: parseFloat(parts[3]) };
                    }
                }
                var w = parseFloat(svgElement.getAttribute('width'));
                var h = parseFloat(svgElement.getAttribute('height'));
                if (w && h) return { width: w, height: h };
                var rect = svgElement.getBoundingClientRect();
                return { width: rect.width || 800, height: rect.height || 600 };
            }

            // --- 导出高清 PNG ---
            function exportPng(scale) {
                scale = scale || 2;
                var xml = getSvgXml();
                if (!xml) return;

                showToast('正在渲染高清图片...');
                var blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var img = new Image();

                img.onload = function() {
                    var size = getSvgSize();
                    var canvas = document.createElement('canvas');
                    canvas.width = Math.round(size.width * scale);
                    canvas.height = Math.round(size.height * scale);
                    var ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(function(pngBlob) {
                        var pngUrl = URL.createObjectURL(pngBlob);
                        var a = document.createElement('a');
                        a.href = pngUrl;
                        a.download = 'card-' + Date.now() + '.png';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(function() {
                            URL.revokeObjectURL(pngUrl);
                            URL.revokeObjectURL(url);
                        }, 1200);
                        showToast('✓ 高清 PNG 已下载');
                    }, 'image/png');
                };

                img.onerror = function() {
                    URL.revokeObjectURL(url);
                    showToast('渲染 PNG 失败，请直接下载 SVG');
                };

                img.src = url;
            }

            // --- 导出 SVG 原文件 ---
            function exportSvg() {
                var xml = getSvgXml();
                if (!xml) return;
                var blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'card-' + Date.now() + '.svg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(url); }, 1200);
                showToast('✓ SVG 文件已下载');
            }

            // --- 绑定下载事件 ---
            btnDownloadPng.addEventListener('click', function(e) {
                e.stopPropagation();
                exportPng(2);
            });
            btnDownloadSvg.addEventListener('click', function(e) {
                e.stopPropagation();
                exportSvg();
            });

            lightboxDownloadPng.addEventListener('click', function(e) {
                e.stopPropagation();
                exportPng(2);
            });
            lightboxDownloadSvg.addEventListener('click', function(e) {
                e.stopPropagation();
                exportSvg();
            });
        })();
    </script>
